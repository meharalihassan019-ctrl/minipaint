<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111e47" />
      <stop offset="50%" stop-color="#1e295d" />
      <stop offset="100%" stop-color="#0c1634" />
    </linearGradient>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle glowing ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="4" />

  <g filter="url(#shadow)">
    <!-- Wooden Artist Palette Base -->
    <path d="M 256 90 C 160 90 90 160 90 256 C 90 340 150 410 230 418 C 248 420 264 406 264 388 C 264 374 274 362 288 360 C 316 356 338 382 368 382 C 416 382 432 320 422 250 C 412 165 350 90 256 90 Z" fill="url(#paletteGrad)" stroke="#d97706" stroke-width="8" stroke-linejoin="round" />

    <!-- Palette Thumb Hole -->
    <ellipse cx="370" cy="310" rx="28" ry="36" fill="#111e47" />

    <!-- Vibrant Paint Color Dollops -->
    <!-- Strawberry Red/Pink -->
    <circle cx="160" cy="190" r="28" fill="#f43f5e" stroke="#fff" stroke-width="4" />
    <circle cx="152" cy="182" r="8" fill="#fff" opacity="0.6" />

    <!-- Mango Sunshine Yellow -->
    <circle cx="215" cy="140" r="28" fill="#fbbf24" stroke="#fff" stroke-width="4" />
    <circle cx="207" cy="132" r="8" fill="#fff" opacity="0.6" />

    <!-- Emerald Jade Green -->
    <circle cx="295" cy="140" r="28" fill="#10b981" stroke="#fff" stroke-width="4" />
    <circle cx="287" cy="132" r="8" fill="#fff" opacity="0.6" />

    <!-- Sky Blue -->
    <circle cx="350" cy="190" r="28" fill="#0ea5e9" stroke="#fff" stroke-width="4" />
    <circle cx="342" cy="182" r="8" fill="#fff" opacity="0.6" />

    <!-- Royal Purple -->
    <circle cx="160" cy="275" r="28" fill="#8b5cf6" stroke="#fff" stroke-width="4" />
    <circle cx="152" cy="267" r="8" fill="#fff" opacity="0.6" />

    <!-- Artist Paintbrush cutting across -->
    <g transform="rotate(-32 270 270)">
      <!-- Brush Handle -->
      <rect x="256" y="70" width="22" height="240" rx="11" fill="#78350f" stroke="#451a03" stroke-width="3" />
      <!-- Silver Ferrule -->
      <rect x="254" y="290" width="26" height="40" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
      <!-- Brush Bristles -->
      <path d="M 254 330 C 254 360 267 385 267 385 C 267 385 280 360 280 330 Z" fill="#ec4899" stroke="#be185d" stroke-width="2" />
      <!-- Wet paint drip on bristle tip -->
      <circle cx="267" cy="385" r="7" fill="#ec4899" />
    </g>

    <!-- Star Sparkles for Kid Magic -->
    <path d="M 120 110 Q 120 125 105 125 Q 120 125 120 140 Q 120 125 135 125 Q 120 125 120 110 Z" fill="#fbbf24" />
    <path d="M 400 110 Q 400 125 385 125 Q 400 125 400 140 Q 400 125 415 125 Q 400 125 400 110 Z" fill="#fbbf24" />
    <path d="M 230 435 Q 230 445 220 445 Q 230 445 230 455 Q 230 445 240 445 Q 230 445 230 435 Z" fill="#38bdf8" />
  </g>
</svg>
